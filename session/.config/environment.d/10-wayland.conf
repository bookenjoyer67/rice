# Wayland session environment, applied by systemd's user manager to every
# session started through niri-session (greetd/tuigreet -> niri-session).
# Keep this file in the repo: without it a fresh install gets no Wayland
# backend hints, no X11 DISPLAY for xwayland-satellite apps and — the visible
# one — no cursor theme, so niri logs
#   WARN niri::cursor: error loading xcursor default@24: no default icon
# and the pointer disappears.
GDK_BACKEND=wayland
QT_QPA_PLATFORM=wayland
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
MOZ_ENABLE_WAYLAND=1
XCURSOR_THEME=Bibata-Rainbow-Modern
XCURSOR_SIZE=24
# X11 display served by xwayland-satellite (Steam and other X11 clients want it)
DISPLAY=:0
