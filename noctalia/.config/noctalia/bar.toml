
[bar]
order = ["default"]

[bar.default]
start = ["launcher", "computing/wallpaper-browser:button", "computing/theme-refresh:button", "workspaces", "teagar/niri-workspace-preview:preview", "nathan/catwalk:cat", "aabidk20/yt-music:widget"]
center = ["clock"]
end = [
  "media",
  "tray",
  "notifications",
  "clipboard",
  "group:g1",
  "brightness",
  "battery",
  "control-center",
  "session",
]

[[bar.default.capsule_group]]
id = "g1"
members = ["network", "bluetooth", "volume"]
fill = "surface_variant"
border = "outline"
accordion = true
widget_spacing = 8

[bar.default.monitor."HDMI-A-1"]
scale = 1.25
thickness = 22
start = ["launcher", "computing/wallpaper-browser:button", "computing/theme-refresh:button", "workspaces", "teagar/niri-workspace-preview:preview", "aabidk20/yt-music:widget"]
end = [
  "media",
  "tray",
  "notifications",
  "group:g1",
  "control-center",
  "session",
]
