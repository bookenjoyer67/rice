config_version = 15

[audio]
sound_theme = "ocean"

[bar.default]
background_opacity = 0.25999999418854713
capsule = true
capsule_border_width = 1.5
capsule_foreground = "tertiary"
capsule_opacity = 0.28999999351799488
capsule_padding = 8.0
capsule_radius = 12
capsule_thickness = 0.9499999824911356
center = [ "clock" ]
contact_shadow = true
end = [
    "tray",
    "notifications",
    "clipboard",
    "group:g1",
    "cleboost/hotspot:toggle",
    "brightness",
    "battery",
    "control-center",
    "session"
]
icon_color = "primary"
margin_ends = 39
scale = 1.1000000089406967
start = [
    "launcher",
    "wallpaper",
    "computing/theme-refresh:button",
    "workspaces",
    "teagar/niri-workspace-preview:preview",
    "nathan/catwalk:cat",
    "aabidk20/yt-music:widget"
]
thickness = 17

    [bar.default.monitor.HDMI-A-1]
    end = [ "tray", "notifications", "group:g1", "control-center", "session" ]
    scale = 1.25
    start = [
        "launcher",
        "wallpaper",
        "computing/theme-refresh:button",
        "workspaces",
        "teagar/niri-workspace-preview:preview",
        "aabidk20/yt-music:widget"
    ]
    thickness = 22

    [[bar.default.capsule_group]]
    accordion = true
    border = "outline"
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bluetooth", "volume" ]
    widget_spacing = 8

[calendar]
enabled = true

    [calendar.account.calcurse]
    name = "Calcurse"
    path = "/home/computing/.local/share/calcurse-vdir"
    type = "vdir"

