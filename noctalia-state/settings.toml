[dock]
active_monitor_only = true
auto_hide = true
enabled = false
reserve_space = false

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.84999999999999998
blurred_desktop = false
enabled = false
fingerprint = false
tint_intensity = 0.55000000000000004
transition = [ "honeycomb" ]
transition_duration = 800.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
