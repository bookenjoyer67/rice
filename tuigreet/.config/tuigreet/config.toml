
[general]
log_file = "/tmp/tuigreet.log"
default_user = "computing"

[display]
show_time = true
time_format = "%A %d %B  ·  %H:%M"
show_title = true
custom_title = "peak"
battery = true
align_greeting = "center"

[layout]
width = 62
window_padding = 2
container_padding = 2
prompt_padding = 1

[layout.widgets]
time_position = "top"
status_position = "bottom"
battery_position = "right"

[layout.widgets.status_bar]
show_reset = false
show_command = false
show_power = true
show_background = true
show_session_status = true
show_caps_lock = true

[secret]
mode = "characters"
characters = "*"

[remember]
username = true
session = true

[theme]
border = "#7567e4"
container = "#0f0b33"
title = "#de61d0"
greet = "#b9b2ff"
prompt = "#7567e4"
input = "#e8e4ff"
action = "#ff46a2"
button = "#de61d0"
text = "#cfc9ff"
time = "#b9b2ff"

[background]
kind = "matrix-peak"
fps = 30

[background.matrix]
head_color = "#ff46a2"
bright_color = "#de61d0"
dim_color = "#2b1b5e"
rainbow = true
hue_step = 3.0
hue_speed = 2.5
min_length = 6
max_length = 22
min_speed = 0.2
max_speed = 0.9
