[nightlight]
enabled = true

[osd]
border_color = "tertiary"
follow_focused_output = true

[plugin_settings."aabidk20/yt-music"]
debug_logging = true

[plugin_settings."computing/wallpaper-bars"]
audio_source = "easyeffects_sink.monitor"
fps = "144"

[plugins]
enabled = [
    "nathan/catwalk",
    "cleboost/ssh-launcher",
    "teagar/niri-workspace-preview",
    "yuuto/arch-updater",
    "tausif/ncs-visualizer",
    "liamwh/emoji-picker",
    "computing/desktop-cat",
    "imjustdoingmypart/niri-animations",
    "aabidk20/yt-music",
    "weinguyen/procmon",
    "computing/desktop-essentials",
    "computing/theme-refresh",
    "computing/wallpaper-browser",
    "computing/wallpaper-bars"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/computing/.config/noctalia-v5-plugins"
    name = "local"

[shell]
avatar_path = "/home/computing/Pictures/wallpapers/wallhaven-01rj5w.jpg"
niri_overview_type_to_launch_enabled = true

    [shell.animation]
    speed = 2.3500000350177288

    [shell.launcher]
    app_grid = true
    categories = false
    compact = true
    layout = "simple"

    [shell.panel]
    control_center_placement = "floating"
    list_item_background = true
    transparency_mode = "glass"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "niri" ]
    community_ids = [ "brave", "neovim", "obsidian", "vscode", "bat", "fzf", "tmux", "zellij", "fastfetch", "pywalfox" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/home/computing/.cache/wallpaper/wallpaper.png"

    [wallpaper.last]
    path = "/home/computing/.cache/wallpaper/wallpaper.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/computing/.cache/wallpaper/wallpaper.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/computing/.cache/wallpaper/wallpaper.png"

[weather]
unit = "imperial"

[widget.battery]
color = "on_surface"

[widget.brightness]
color = "on_surface"

[widget.clock]
color = "on_surface"
format = "%-I:%M %p"

[widget."teagar/niri-workspace-preview:preview"]
enabled = true
output_scope = "current"