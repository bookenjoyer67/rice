# BEGIN_KITTY_THEME
# Divine Machinery — sacred circuitry palette
include divine-machinery.conf
# END_KITTY_THEME
# Wallpaper-derived background color (matugen, regenerated on wallpaper change)
include matugen-bg.conf
#

font_family CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14

# Terminal session: fish, so the greeting (conf.d/rice.fish) runs on every new
# terminal. fish is in packages.txt; the commented line is the fallback if a
# machine deliberately ships without it.
shell /usr/bin/fish
# shell /bin/bash
allow_remote_control yes

background_opacity 0.65
dynamic_background_opacity yes
background_blur 200

hide_window_decorations titlebar-only

# Tab bar layout
tab_bar_style powerline
tab_bar_edge bottom

# Window
window_padding_width 1
placement_strategy center

# Scrollback
scrollback_lines 10000
scrollback_pager_history_size 100

# Cursor
cursor_shape block
cursor_blink_interval 0.5
