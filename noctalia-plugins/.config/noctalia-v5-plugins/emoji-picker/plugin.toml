id = "liamwh/emoji-picker"
name = "Emoji & Symbol Picker"
version = "1.2.0"
plugin_api = 28
author = "liamwh"
license = "MIT"
dependencies = []
tags = ["bar", "panel", "emoticon", "utility"]
icon = "mood-smile"
description = "Raycast-inspired emoji & Unicode symbol browser: instant search, categories, recents."

[[setting]]
key = "paste_command"
type = "string"
label_key = "settings.paste_command.label"
description_key = "settings.paste_command.description"
default = ""

[[widget]]
id = "widget"
entry = "widget.luau"

[[panel]]
id = "wide"
entry = "wide.luau"
width = 780
height = 640
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
dismiss_on_outside_click = true
capture_keys = ["up", "down", "left", "right", "enter"]

[[panel]]
id = "desktop"
entry = "desktop.luau"
width = 640
height = 610
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
dismiss_on_outside_click = true
capture_keys = ["up", "down", "left", "right", "enter"]

[[panel]]
id = "compact"
entry = "compact.luau"
width = 480
height = 580
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
dismiss_on_outside_click = true
capture_keys = ["up", "down", "left", "right", "enter"]
