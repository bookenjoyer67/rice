# Session PATH for programs started by the compositor (niri, noctalia, its
# plugins), which inherit the systemd user environment — NOT the fish shell's.
# ~/.local/bin holds pip --user / cargo-installed helpers (yt-dlp, hermes,
# luau-lsp) and previously went missing, which is why yt-music could not find
# yt-dlp even though the binary existed.
#
# environment.d takes literal values only: no $PATH expansion, no ~ expansion.
# So this list is spelled out — keep the tail in sync with the login default.
PATH=/home/computing/.local/bin:/home/computing/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/opt/cuda/bin:/var/lib/flatpak/exports/bin:/usr/lib/jvm/default/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl
